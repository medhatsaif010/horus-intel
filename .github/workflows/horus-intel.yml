name: Horus threat-intel pack

on:
  schedule:
    - cron: "17 3 * * *"   # every day 03:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["build_intel.py", ".github/workflows/horus-intel.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml cryptography
      - name: Build and sign the pack
        env:
          HORUS_INTEL_KEY: ${{ secrets.HORUS_INTEL_KEY }}
          HORUS_USE_CISA: "1"
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          set -o pipefail
          python build_intel.py --out out 2>&1 | tee out-build.log
          cp out-build.log out/build.log
      - name: Publish to the "intel" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view intel >/dev/null 2>&1 || gh release create intel --title "Horus threat intel" --notes "Signed pack, rebuilt daily."
          gh release upload intel out/horus-intel.json out/horus-intel.sig out/build.log --clobber
